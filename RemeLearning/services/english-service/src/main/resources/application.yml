spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: english-service
  datasource:
    url: ${DB_URL:localhost}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    schema: ${DB_SCHEMA:reme_english}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: english-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: ${DB_SCHEMA:reme_english}
    create-schemas: true
  servlet:
    multipart:
      max-file-size: ${ENGLISH_MAX_FILE_SIZE:50MB}
      max-request-size: ${ENGLISH_MAX_REQUEST_SIZE:60MB}

server:
  port: 8085

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

reme:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  storage:
    # local (default) reads the dictation audio library from disk and stores generated TTS there;
    # switch to s3/drive later without code changes (see common's storage/README.md).
    provider: ${STORAGE_PROVIDER:local}
    local:
      root: ${STORAGE_LOCAL_ROOT:D:/Personal Project/Audio}
    s3:
      bucket: ${STORAGE_S3_BUCKET:reme-dictation-audio}
    drive:
      root-folder-id: ${STORAGE_DRIVE_ROOT_FOLDER_ID:}
  s3:
    region: ${S3_REGION:ap-southeast-1}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  drive:
    credentials-base64: ${DRIVE_CREDENTIALS_JSON_B64:}
    credentials-file: ${DRIVE_CREDENTIALS_FILE:}
    application-name: RemeLearning
  # Dictation content library (topics/lessons), tried in order S3 -> Drive -> local per
  # FallbackFileReader/FallbackDirectoryLister; any blank source is skipped.
  dictation:
    s3:
      bucket: ${STORAGE_S3_BUCKET:reme-dictation-audio}
    drive:
      root-folder-id: ${DICTATION_DRIVE_ROOT_FOLDER_ID:}
    local:
      root-path: ${STORAGE_LOCAL_ROOT:D:/Personal Project/Audio}
  llm:
    provider: ${LLM_PROVIDER:zen} #  gemini | ollama | zen
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
    ollama:
      model: ${OLLAMA_MODEL:deepseek-v4-flash:cloud}
      api-key: ${OLLAMA_API_KEY:}
    zen:
      api-key: ${ZEN_API_KEY:}
      model: ${ZEN_MODEL:big-pickle}
      reasoning-enabled: ${ZEN_REASONING_ENABLED:false}
  tts:
    # supertonic (default) calls ai-service's on-device Supertonic model; google is the alternative.
    provider: ${TTS_PROVIDER:supertonic}
    supertonic:
      base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    google:
      api-key: ${GOOGLE_TTS_API_KEY:}
  alignment:
    # ai-service's Whisper word-timestamp alignment (POST /api/v1/dictation/align-sentences), used by
    # dictation's getClipDetail to lazily fill in sentences[].startMs/endMs.
    ai-service:
      base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
      read-timeout-seconds: ${ALIGNMENT_READ_TIMEOUT_SECONDS:120}

vocabulary:
  classifier:
    mode: ${VOCABULARY_CLASSIFIER_MODE:rule-based} # rule-based | llm
    max-output-tokens: ${VOCABULARY_CLASSIFIER_MAX_TOKENS:10}
  library:
    max-output-tokens: ${VOCABULARY_LIBRARY_MAX_TOKENS:1500}
  practice:
    max-output-tokens: ${VOCABULARY_PRACTICE_MAX_TOKENS:1200}

grammar:
  classifier:
    mode: ${GRAMMAR_CLASSIFIER_MODE:rule-based} # rule-based | llm
    max-output-tokens: ${GRAMMAR_CLASSIFIER_MAX_TOKENS:10}
  library:
    max-output-tokens-topic-content: ${GRAMMAR_LIBRARY_MAX_TOKENS_TOPIC_CONTENT:5200}
    max-output-tokens-retry-question: ${GRAMMAR_LIBRARY_MAX_TOKENS_RETRY_QUESTION:400}
  practice:
    max-output-tokens: ${GRAMMAR_PRACTICE_MAX_TOKENS:1200}

pronunciation:
  classifier:
    mode: ${PRONUNCIATION_CLASSIFIER_MODE:rule-based} # rule-based | llm
    max-output-tokens: ${PRONUNCIATION_CLASSIFIER_MAX_TOKENS:10}

dictation:
  # rule-based (default, no LLM cost) or llm (Gemini) for the miss analysis + practice sentences.
  analyzer:
    mode: ${DICTATION_ANALYZER_MODE:llm} # rule-based | llm
    max-output-tokens-analyze: ${DICTATION_ANALYZER_MAX_TOKENS_ANALYZE:700}
    max-output-tokens-practice: ${DICTATION_ANALYZER_MAX_TOKENS_PRACTICE:400}
  # The fixed audio library (rooted at reme.storage.local.root) is imported into dictation_clips on
  # startup via common's StorageClient. Turn off to skip the scan (e.g. once already imported).
  library:
    import-on-startup: ${DICTATION_IMPORT_ON_STARTUP:true}
  # Supertonic voice/lang used when synthesizing AI-practice audio.
  tts:
    voice: ${DICTATION_TTS_VOICE:F1}
    lang: ${DICTATION_TTS_LANG:en}
  ai-practice:
    # How many of the learner's most-missed words feed a fresh AI-practice batch.
    miss-window: ${DICTATION_MISS_WINDOW:8}
  dialogue:
    max-output-tokens: ${DICTATION_DIALOGUE_MAX_TOKENS:400}
    max-output-tokens-with-translation: ${DICTATION_DIALOGUE_MAX_TOKENS_WITH_TRANSLATION:700}
  translator:
    max-output-tokens: ${DICTATION_TRANSLATOR_MAX_TOKENS:600}

listening:
  practice:
    max-output-tokens-per-passage: ${LISTENING_PRACTICE_MAX_TOKENS_PER_PASSAGE:1300}
    max-output-tokens-overhead: ${LISTENING_PRACTICE_MAX_TOKENS_OVERHEAD:600}
  library:
    max-output-tokens: ${LISTENING_LIBRARY_MAX_TOKENS:3500}
  scoring:
    max-output-tokens: ${LISTENING_SCORING_MAX_TOKENS:300}

speaking:
  practice:
    max-output-tokens: ${SPEAKING_PRACTICE_MAX_TOKENS:400}
  library:
    max-output-tokens: ${SPEAKING_LIBRARY_MAX_TOKENS:1200}

writing:
  grading:
    max-output-tokens: ${WRITING_GRADING_MAX_TOKENS:16000}
  practice:
    max-output-tokens: ${WRITING_PRACTICE_MAX_TOKENS:8000}
  library:
    max-output-tokens: ${WRITING_LIBRARY_MAX_TOKENS:1400}
  suggestion:
    max-output-tokens: ${WRITING_SUGGESTION_MAX_TOKENS:900}
