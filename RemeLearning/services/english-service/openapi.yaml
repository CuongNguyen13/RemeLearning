          properties:
            data:
              type: object
              additionalProperties:
                type: array
                items: { $ref: "#/components/schemas/ListeningWeakPoint" }

    ApiResponsePronunciationWeakPointGrouped:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                type: array
                items: { $ref: "#/components/schemas/PronunciationWeakPoint" }

    ApiResponseBase:
      type: object
      properties:
        success: { type: boolean }
