      description: A section ready to practice - its pool of sample sentences.
      properties:
        sectionId: { type: integer, format: int64 }
        sentences: { type: array, items: { $ref: "#/components/schemas/SpeakingLibrarySectionSentence" } }

    ApiResponseSpeakingLibrarySection:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SpeakingLibrarySection" }

    SentenceAttemptResult:
      type: object
      description: Scoring result for one recorded sentence attempt - does not itself affect topic gating (see the finish endpoint).
      properties:
        sentenceId: { type: integer, format: int64 }
        phonemeScore: { type: number, format: double }
        wordScore: { type: number, format: double }
        passed: { type: boolean }
        transcript: { type: string }

    ApiResponseSentenceAttemptResult:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SentenceAttemptResult" }

    FinishSpeakingSection:
      type: object
      properties:
        totalSentences: { type: integer }
        passedSentences: { type: integer }
        passed: { type: boolean }
        nextTopicId: { type: integer, format: int64, nullable: true }
        nextTopicUnlocked: { type: boolean }

    ApiResponseFinishSpeakingSection:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FinishSpeakingSection" }

    SpeakingLibraryAttempt:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: string }
        sectionId: { type: integer, format: int64 }
        sentenceId: { type: integer, format: int64 }
        phonemeScore: { type: number, format: double }
        wordScore: { type: number, format: double }
        recordedAudioStorageKey: { type: string, nullable: true }
        weakPhonemesJson: { type: string, nullable: true, description: "JSON array of IPA symbols scored below the GOP weak-phoneme threshold for this attempt" }
        createdAt: { type: string, format: date-time }

    ApiResponseSpeakingLibraryAttemptList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/SpeakingLibraryAttempt" } }

    SpeakingHistoryEntry:
      type: object
      description: >
        One row in the merged speaking history list - either a "học thường" (learn) attempt or a
        "Thư viện" (library) sentence attempt, normalized to one shape and tagged by source. Library
        rows stay at SpeakingLibraryAttempt's existing granularity (one per scored sentence attempt).
      properties:
        source: { type: string, enum: [LEARN, LIBRARY] }
        attemptOrSessionId: { type: integer, format: int64 }
        completedAt: { type: string, format: date-time, nullable: true }
        score: { type: number, format: double, nullable: true }
        sectionId: { type: integer, format: int64, nullable: true, description: "Only populated for LIBRARY rows - kept for reference/debugging." }
        topicId: { type: integer, format: int64, nullable: true, description: "Only populated for LIBRARY rows (resolved server-side from sectionId) - the FE's \"Làm lại\" deep-link navigation target." }

    ApiResponseSpeakingHistoryEntryList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/SpeakingHistoryEntry" } }

    # --- Luyện viết & Luyện dịch (writing skill) ---

    WritingTaskType:
      type: string
      enum: [COMPOSE, TRANSLATE_VI_EN, TRANSLATE_EN_VI]
      description: >
        COMPOSE - learner writes English from a Vietnamese brief; TRANSLATE_VI_EN / TRANSLATE_EN_VI -
        learner translates the given source passage. Decides what promptText means and which fourth
        criterion is scored (taskResponse vs accuracy).

    GenerateWritingPracticeRequest:
      type: object
      required: [taskType]
      properties:
        taskType: { $ref: "#/components/schemas/WritingTaskType" }
        level: { type: string, nullable: true, example: B1, description: CEFR target }
        examType:
          type: string
          nullable: true
          enum: [TOEIC, IELTS, TOEFL, VSTEP, General]
          example: IELTS
          description: >
            Decides the generated task's shape, not just a label pasted into the prompt: the source
            passage's sentence count is drawn randomly from that exam's range per generation (TOEIC
            2-4, IELTS 4-6, TOEFL/VSTEP/General 3-5), and its subject area and register come from the
            same profile. For COMPOSE it also picks which kind of text the brief asks for (a TOEIC
            brief asks for an email or short report, an IELTS one for a Task 2 essay). Case-insensitive;
            an unrecognised value is passed through to the model but falls back to everyday-English
            length/register.
        focusItems:
          type: array
          nullable: true
          description: >
            Weak-point labels to build the task around. Empty/omitted falls back to the learner's own
            top grammar AND vocabulary weak points combined.
          items: { type: string }

    WritingPracticeItem:
      type: object
      description: >
        One writing/translation prompt. Deliberately has NO referenceAnswer field - the model answer
        must not reach the client before the learner submits.
      properties:
        practiceItemId: { type: integer, format: int64 }
        taskType: { $ref: "#/components/schemas/WritingTaskType" }
        level: { type: string, nullable: true }
        examType: { type: string, nullable: true }
        topic: { type: string, nullable: true }
        promptText:
          type: string
          description: >
            The task brief (COMPOSE) or the source passage to translate (TRANSLATE_*). Always carries
            a Vietnamese instruction line, per the project rule that every practice item states its
            requirement in Vietnamese.
        sourceLang: { type: string, example: vi }
        targetLang: { type: string, example: en }
        targetLabels:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    SuggestNextSentenceRequest:
      type: object
      required: [practiceItemId]
      properties:
        practiceItemId: { type: integer, format: int64 }
        draftText:
          type: string
          nullable: true
          description: What the learner has written so far; blank means they need help starting.

    WritingSuggestion:
      type: object
      description: A hint, never a finished sentence - the learner still has to compose it.
      properties:
        ideaVi: { type: string, description: What to develop next, in Vietnamese }
        structureHint: { type: string, nullable: true, example: "Although + clause, + main clause" }
        usefulPhrases:
          type: array
          description: English words/collocations that fit, never a full sentence.
          items: { type: string }

    WritingCriteriaScores:
      type: object
      description: >
        Per-criterion scores in [0, 1]. Only the fourth criterion relevant to the task type is
        populated - accuracy for the TRANSLATE_* types, taskResponse for COMPOSE - so the other stays
        null.
      properties:
        grammar: { type: number, format: double, nullable: true }
        vocabulary: { type: number, format: double, nullable: true }
        coherence: { type: number, format: double, nullable: true }
        accuracy: { type: number, format: double, nullable: true }
        taskResponse: { type: number, format: double, nullable: true }

    WritingError:
      type: object
      description: >
        One labelled mistake. The label + category pair is the point of this object: it is what gets
        routed into the learner's existing grammar/vocabulary weak points, review queue and
        recommendations.
      properties:
        wrong: { type: string, nullable: true, description: The incorrect span, quoted from the learner's own text }
        corrected: { type: string, nullable: true }
        label:
          type: string
          description: >
            A short, reusable name for the underlying weakness (e.g. "past perfect",
            "collocation: make/do") - not a description of this one sentence.
          example: past perfect
        category:
          type: string
          enum: [grammar, vocabulary]
          description: Anything else is dropped rather than routed, since no domain owns it.
        explanationVi: { type: string, nullable: true }
        severity: { type: string, nullable: true, enum: [minor, major] }

    SubmitWritingAttemptRequest:
      type: object
      required: [userId, practiceItemId, submittedText]
      properties:
        userId: { type: string }
        practiceItemId: { type: integer, format: int64 }
        submittedText: { type: string }

    WritingAttemptResult:
      type: object
      properties:
        attemptId: { type: integer, format: int64 }
        overallScore:
          type: number
          format: double
          description: Mean of the populated criteria, computed server-side rather than taken from the LLM.
        criteria: { $ref: "#/components/schemas/WritingCriteriaScores" }
        correctedText: { type: string, nullable: true }
        errors:
          type: array
          items: { $ref: "#/components/schemas/WritingError" }
        feedback: { type: string, nullable: true, description: Overall remarks in Vietnamese }
        referenceAnswer:
          type: string
          nullable: true
          description: Only revealed here, now that the learner has submitted.
        actionAdvice:
          type: array
          items: { type: string }

    WritingAttemptHistoryEntry:
      type: object
      properties:
        attemptId: { type: integer, format: int64 }
        practiceItemId: { type: integer, format: int64 }
        taskType: { $ref: "#/components/schemas/WritingTaskType" }
        level: { type: string, nullable: true }
        examType: { type: string, nullable: true }
        topic: { type: string, nullable: true }
        score: { type: number, format: double }
        attemptedAt: { type: string, format: date-time }

    WritingAttemptDetail:
      type: object
      properties:
        attemptId: { type: integer, format: int64 }
        practiceItemId: { type: integer, format: int64 }
        taskType: { $ref: "#/components/schemas/WritingTaskType" }
        level: { type: string, nullable: true }
        examType: { type: string, nullable: true }
        topic: { type: string, nullable: true }
        promptText: { type: string }
        submittedText: { type: string }
        correctedText: { type: string, nullable: true }
        overallScore: { type: number, format: double }
        criteria: { $ref: "#/components/schemas/WritingCriteriaScores" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/WritingError" }
        feedback: { type: string, nullable: true }
        referenceAnswer: { type: string, nullable: true }
        attemptedAt: { type: string, format: date-time }

    WritingLibraryTopic:
      type: object
      properties:
        topicId: { type: integer, format: int64 }
        taxonomy: { type: string, enum: [grammar, genre, vocab_theme] }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        level: { type: string }
        sequenceOrder:
          type: integer
          description: Unique within this topic's taxonomy only; each axis restarts at 1.
        status: { type: string, enum: [LOCKED, UNLOCKED, IN_PROGRESS, PASSED] }
        passedPromptCount: { type: integer }
        targetPromptCount:
          type: integer
          description: How many prompts the chain holds once fully generated (3-6, derived per topic).

    WritingLibraryPrompt:
      type: object
      description: Like WritingPracticeItem, carries no reference answer before submission.
      properties:
        promptId: { type: integer, format: int64 }
        topicId: { type: integer, format: int64 }
        topicName: { type: string }
        taskType: { $ref: "#/components/schemas/WritingTaskType" }
        promptText: { type: string }
        sourceLang: { type: string }
        targetLang: { type: string }
        minWords: { type: integer, nullable: true }
        position: { type: integer, description: 1-based position in the topic's chain }
        targetPromptCount: { type: integer }

    SubmitWritingLibraryAnswerRequest:
      type: object
      required: [submittedText]
      properties:
        submittedText: { type: string }

    SubmitWritingLibraryAnswerResponse:
      type: object
      description: >
        A superset of WritingAttemptResult - the same grader fields, plus how the submission moved the
        learner through the topic chain.
      properties:
        attemptId: { type: integer, format: int64 }
        score: { type: number, format: double }
        passed: { type: boolean, description: score >= 0.7 }
        criteria: { $ref: "#/components/schemas/WritingCriteriaScores" }
        correctedText: { type: string, nullable: true }
        errors:
          type: array
          items: { $ref: "#/components/schemas/WritingError" }
        feedback: { type: string, nullable: true }
        referenceAnswer: { type: string, nullable: true }
        actionAdvice:
          type: array
          items: { type: string }
        passedPromptCount: { type: integer }
        targetPromptCount: { type: integer }
        topicPassed:
          type: boolean
          description: True once the whole chain is passed and the topic itself flipped to PASSED.
        nextTopicId:
          type: integer
          format: int64
          nullable: true
          description: The next topic on the SAME axis, if passing this topic just unlocked it.
        nextTopicUnlocked: { type: boolean }

    ApiResponseWritingPracticeItem:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/WritingPracticeItem" }

    ApiResponseWritingPracticeItemList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WritingPracticeItem" }

    ApiResponseWritingSuggestionList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WritingSuggestion" }

    ApiResponseWritingAttemptResult:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/WritingAttemptResult" }

    ApiResponseWritingAttemptHistoryEntryList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WritingAttemptHistoryEntry" }

    ApiResponseWritingAttemptDetail:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/WritingAttemptDetail" }

    ApiResponseWritingLibraryTopicList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WritingLibraryTopic" }

    ApiResponseWritingLibraryPrompt:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/WritingLibraryPrompt" }

    ApiResponseSubmitWritingLibraryAnswerResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SubmitWritingLibraryAnswerResponse" }
