        built on the first request for that passage's /audio endpoint, so one generate call stays
        a single LLM round trip instead of dozens of TTS calls.
      operationId: generateListeningPractice
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        description: >
          All fields optional; an empty/omitted body falls back to the learner's own recently
          missed keywords. translationLang enables a per-line translation, only revealed after
          the attempt is submitted.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateListeningPracticeRequest"
      responses:
        "200":
          description: OK
