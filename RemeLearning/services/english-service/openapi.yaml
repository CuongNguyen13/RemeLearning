      tags: [Speaking Learn]
      summary: >
        Submit a learner's recorded attempt (multipart audio); scores it via ai-service's
        wav2vec2 GOP model and feeds each scored word into the existing weak-point/
        spaced-repetition pipeline
      operationId: submitSpeakingAttempt
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [practiceItemId, audio]
              properties:
                practiceItemId: { type: integer, format: int64 }
                audio: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSpeakingAttemptResult"

  /api/v1/learn/speaking/history/{userId}:
    get:
      tags: [Speaking Learn]
      summary: A learner's past speaking-practice attempts, newest first
      operationId: getSpeakingAttemptHistory
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSpeakingAttemptHistoryEntryList"

  /api/v1/learn/speaking/history/{userId}/{attemptId}:
    get:
      tags: [Speaking Learn]
      summary: Full detail for one of a learner's own past attempts
      operationId: getSpeakingAttemptDetail
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: attemptId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSpeakingAttemptDetail"

  /api/v1/learn/speaking/history/{userId}/{attemptId}/ai-practice:
    post:
      tags: [Speaking Learn]
      summary: >
        Generate AI practice targeted at one specific past attempt's mispronounced phonemes (the
        "Luyện tập với AI" action from a history row) - extracts the attempt's persisted
        weakPhonemesJson (a flat list of short IPA symbols), generates a new sentence targeting
        only those phonemes, persists it into the shared speaking_practice_items bank, and returns
        the learner's refreshed practice-set list
      operationId: generateSpeakingPracticeFromAttempt
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: attemptId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSpeakingPracticeItemList"
        "404":
          description: Attempt not found or doesn't belong to this learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  /api/v1/learn/speaking/merged-history/{userId}:
    get:
      tags: [Speaking Learn]
      summary: >
        A learner's merged speaking history: "học thường" attempts + Thư viện sentence attempts
        combined into one time-sorted list, each tagged by source (LEARN or LIBRARY)
      operationId: getSpeakingMergedHistory
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSpeakingHistoryEntryList"

  /api/v1/learn/speaking/library/{userId}/topics:
    get:
      tags: [Speaking Library]
      summary: List every catalog topic with this learner's own progression status
      operationId: getSpeakingLibraryTopics
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSpeakingLibraryTopicList"

  /api/v1/learn/speaking/library/{userId}/topics/{topicId}/sections:
    post:
      tags: [Speaking Library]
      summary: Start a new Section for a topic (generating one via AI on first read), or resume its most recent one
      operationId: startOrResumeSpeakingLibrarySection
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: topicId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSpeakingLibrarySection"
        "403":
          description: Topic is locked for this learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  /api/v1/learn/speaking/library/{userId}/sections/{sectionId}/sentences/{sentenceId}/attempts:
    post:
      tags: [Speaking Library]
      summary: Submit a learner's recorded attempt at one sentence (multipart audio); scores it via ai-service's wav2vec2 GOP model - does not itself affect topic gating
      operationId: submitSpeakingLibrarySentenceAttempt
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: sectionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: sentenceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio: { type: string, format: binary }
              required: [audio]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSentenceAttemptResult"
        "404":
          description: Section or sentence not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  /api/v1/learn/speaking/library/{userId}/sections/{sectionId}/finish:
    post:
      tags: [Speaking Library]
      summary: Finish a section; if every sentence has a passing attempt, marks the topic PASSED and unlocks the next topic
      operationId: finishSpeakingLibrarySection
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: sectionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFinishSpeakingSection"

  /api/v1/learn/speaking/library/{userId}/sections/history:
    get:
      tags: [Speaking Library]
      summary: This learner's scored sentence attempts, across all topics
      operationId: getSpeakingLibraryHistory
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSpeakingLibraryAttemptList"

  /api/v1/learn/speaking/library/{userId}/sections/{sectionId}/ai-practice:
    post:
      tags: [Speaking Library]
      summary: >
        Generate AI practice targeted at this learner's own mispronunciations across every
        sentence attempt they've made on this section (the "Luyện tập với AI" action) - unions the
        weakPhonemesJson of every one of this learner's own attempts tied to the section (not just
        the latest, since speaking-library scores per sentence, not per section), generates a new
        sentence targeting those phonemes, and persists into the same speaking_practice_items bank
        the learn flow uses
      operationId: generateSpeakingPracticeFromSection
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: sectionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSpeakingPracticeItemList"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  # --- Luyện viết & Luyện dịch (writing skill) ---
  # One domain covers three task types (COMPOSE / TRANSLATE_VI_EN / TRANSLATE_EN_VI). Note there is
  # no writing weak-point endpoint: every graded error already carries category "grammar" or
  # "vocabulary" and is routed into those domains' weak points, so a writing mistake merges with the
  # same label from dictation/listening instead of forming a parallel tally.

  /api/v1/learn/writing/{userId}/generate:
    post:
      tags: [Writing Learn]
      summary: >
        Generate one AI writing brief or translation passage for the requested task type, targeting
        the given focus items or (if omitted) the learner's own most-forgotten grammar AND vocabulary
        labels
      operationId: generateWritingPractice
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        description: >
          taskType is required and decides what promptText means; focusItems, when empty/omitted,
          falls back to the learner's top grammar and vocabulary weak points combined - writing is
          the one skill that exercises both at once.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWritingPracticeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWritingPracticeItem"

  /api/v1/learn/writing/items/{itemId}:
    get:
      tags: [Writing Learn]
      summary: One practice prompt, without its reference answer
      operationId: getWritingPracticeItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWritingPracticeItem"

  /api/v1/learn/writing/{userId}/items:
    get:
      tags: [Writing Learn]
      summary: A learner's generated practice prompts, newest first
      operationId: listWritingPracticeItems
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWritingPracticeItemList"

  /api/v1/learn/writing/suggest:
    post:
      tags: [Writing Learn]
      summary: >
        2-3 hints for the learner's next sentence - a Vietnamese idea plus English structure/phrase
        scaffolding, never a ready-made sentence
      description: >
        One LLM call per press of the button; there is no as-you-type/ghost-text mode, so a learner
        who never asks for a hint costs nothing. For the two TRANSLATE_* task types the prompt is
        hard-restricted to naming the required structure and glossing at most two difficult words,
        and the prompt's reference answer is never passed to the suggester at all - an unconstrained
        hint there would simply be the answer. Returns an empty list (never an error) if the LLM is
        unavailable.
      operationId: suggestNextSentence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestNextSentenceRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWritingSuggestionList"

  /api/v1/learn/writing/attempts:
    post:
      tags: [Writing Learn]
      summary: >
        Grade a submitted text per criterion, reveal the reference answer, and feed every labelled
        error into the learner's grammar/vocabulary weak points, review queue and recommendations
      description: >
        overallScore is computed server-side as the mean of the populated criteria, not taken from
        the LLM. Each reported error carries a reusable label plus category ("grammar" or
        "vocabulary"); those are turned into one PracticeService.redo batch, keyed on the existing
        per-category item-id prefixes ("grammar:" / "vocab:"), so a writing mistake updates the same
        weak-point row the other skills already built up. Errors are deduped by (category, label)
        within one submission, and a flawless submission triggers no weak-point write at all.
      operationId: submitWritingAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWritingAttemptRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWritingAttemptResult"

  /api/v1/learn/writing/history/{userId}:
    get:
      tags: [Writing Learn]
      summary: A learner's past writing attempts, newest first
      operationId: getWritingHistory
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWritingAttemptHistoryEntryList"

  /api/v1/learn/writing/history/{userId}/{attemptId}:
    get:
      tags: [Writing Learn]
      summary: Full detail for one of a learner's own past attempts
      description: >
        Read back from the stored grade rather than re-graded, so opening history costs no LLM call
        and always shows exactly what the learner saw. 404 if the attempt belongs to another learner.
      operationId: getWritingAttemptDetail
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: attemptId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWritingAttemptDetail"

  /api/v1/learn/writing/history/{userId}/{attemptId}/ai-practice:
    post:
      tags: [Writing Learn]
      summary: >
        Generate practice targeted at one specific past attempt's mistakes (the "Luyện lại những lỗi
        này" action)
      description: >
        Re-reads that attempt's stored errors, extracts their distinct labels, and runs the exact
        same generate-and-persist pipeline the normal flow uses (same task type/level/exam style), so
        the new prompt lands in the same bank.
      operationId: generateWritingPracticeFromAttempt
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: attemptId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: examType
          in: query
          required: false
          schema: { type: string, enum: [TOEIC, IELTS, TOEFL, VSTEP, General] }
          description: >
            Exam style to shape the generated task. Decides the source passage's sentence count
            (drawn randomly from that exam's range per generation), its subject area and its register -
            TOEIC is a short practical workplace text, IELTS a longer academic passage. Omitted keeps
            the original attempt's exam style; an unrecognised value degrades to everyday English.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWritingPracticeItemList"

  /api/v1/learn/writing/library/{userId}/topics:
    get:
      tags: [Writing Library]
      summary: >
        Topics on ONE taxonomy axis with this learner's gating status and chain progress; bootstraps
        that axis's first topic to UNLOCKED for a new learner
      description: >
        The writing library is the only one with three independent axes - grammar (the same 60-topic
        taxonomy as the grammar/listening libraries), genre (12 real-world text types) and
        vocab_theme (the vocabulary library's themes). sequence_order restarts at 1 per axis and
        unlocking only ever looks within one axis, so progress on each is fully independent. An
        unrecognised taxonomy is a 400, not an empty list.
      operationId: getWritingLibraryTopics
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: taxonomy
          in: query
          required: true
          schema: { type: string, enum: [grammar, genre, vocab_theme] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWritingLibraryTopicList"

  /api/v1/learn/writing/library/{userId}/topics/{topicId}/prompts:
    post:
      tags: [Writing Library]
      summary: >
        The next prompt the learner still owes in this topic's chain, generating one via AI if the
        chain is not yet at full length; resumes an already-started prompt otherwise
      description: >
        The catalogue ships topics, not content - each prompt is generated the first time a learner
        reaches that point in the chain, then persisted so it stays stable. Topic must not be LOCKED
        (403 otherwise).
      operationId: startOrResumeWritingLibraryPrompt
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: topicId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: taskType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/WritingTaskType"
        - name: examType
          in: query
          required: false
          schema: { type: string, enum: [TOEIC, IELTS, TOEFL, VSTEP, General] }
          description: >
            Exam style for a NEWLY generated prompt (ignored when an existing prompt is resumed -
            that one was already generated). Decides sentence count and register, so the same library
            topic reads differently for TOEIC than for IELTS.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWritingLibraryPrompt"

  /api/v1/learn/writing/library/{userId}/prompts/{promptId}/submit:
    post:
      tags: [Writing Library]
      summary: >
        Grade a submitted library text and advance the topic chain, unlocking the next topic on the
        same axis once the whole chain is passed
      description: >
        Graded by the same grader the learn tab uses, and its errors go through the same weak-point
        routing. A topic only flips to PASSED once its chain has reached full length AND every prompt
        in it is passed (score >= 0.7).
      operationId: submitWritingLibraryAnswer
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: promptId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWritingLibraryAnswerRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSubmitWritingLibraryAnswerResponse"

  /api/v1/learn/writing/library/{userId}/attempts/{attemptId}/ai-practice:
    post:
      tags: [Writing Library]
      summary: >
        Generate "học thường" practice targeted at one library attempt's own mistakes; lands in the
        same practice bank as the learn tab
      description: Empty list when that attempt had no mistakes to target.
      operationId: generateWritingPracticeFromLibraryAttempt
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: attemptId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: examType
          in: query
          required: false
          schema: { type: string, enum: [TOEIC, IELTS, TOEFL, VSTEP, General] }
          description: >
            Exam style to shape the generated task. Decides the source passage's sentence count
            (drawn randomly from that exam's range per generation), its subject area and its register -
            TOEIC is a short practical workplace text, IELTS a longer academic passage. Omitted keeps
            the original attempt's exam style; an unrecognised value degrades to everyday English.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWritingPracticeItemList"

components:
  schemas:
    VocabularyType:
      type: string
      enum: [NOUN, VERB, ADJECTIVE, ADVERB, PHRASAL_VERB, COLLOCATION, IDIOM, OTHER]

    GrammarType:
      type: string
      enum: [TENSE, SUBJECT_VERB_AGREEMENT, ARTICLE, PREPOSITION, WORD_ORDER, PLURAL, PUNCTUATION, OTHER]

    PronunciationType:
      type: string
      enum: [VOWEL, CONSONANT, STRESS, INTONATION, LINKING, RHYTHM, OTHER]

    ListeningSourceType:
      type: string
      enum: [DICTATION, COMPREHENSION]
      description: >
        DICTATION = dual-written from a dictation miss (in addition to its own root-cause category);
        COMPREHENSION = scored by the practice/redo flow's Java engine for listening-comprehension items.

    TranscriptSegment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        transcriptId: { type: integer, format: int64 }
        speaker: { type: string }
        content: { type: string }
        startSeconds: { type: number, format: double }
        endSeconds: { type: number, format: double }
        segmentOrder: { type: integer }

    TranscriptResponse:
      type: object
      properties:
        recordingId: { type: string }
        userId: { type: string }
        fullText: { type: string }
        segments:
          type: array
          items: { $ref: "#/components/schemas/TranscriptSegment" }

    VocabularyWeakPoint:
      type: object
      properties:
        id: { type: integer, format: int64 }
        recordingId: { type: string }
        userId: { type: string }
        itemId: { type: string }
        label: { type: string }
        vocabularyType: { $ref: "#/components/schemas/VocabularyType" }
        forgettingScore: { type: number, format: double }
        recommendation: { type: string }
        masteryLevel: { type: number, format: double, nullable: true, description: "BKT mastery probability [0,1]; null until the Java engine has scored this item at least once" }
        nextReviewAt: { type: string, format: date-time, nullable: true }
        scoreSource: { type: string, enum: [PYTHON_LEGACY, JAVA_ENGINE] }
        updatedAt: { type: string, format: date-time }

    GrammarWeakPoint:
      type: object
      properties:
        id: { type: integer, format: int64 }
        recordingId: { type: string }
        userId: { type: string }
        itemId: { type: string }
        label: { type: string }
        grammarType: { $ref: "#/components/schemas/GrammarType" }
        forgettingScore: { type: number, format: double }
        recommendation: { type: string }
        masteryLevel: { type: number, format: double, nullable: true, description: "BKT mastery probability [0,1]; null until the Java engine has scored this item at least once" }
        nextReviewAt: { type: string, format: date-time, nullable: true }
        scoreSource: { type: string, enum: [PYTHON_LEGACY, JAVA_ENGINE] }
        updatedAt: { type: string, format: date-time }

    PronunciationWeakPoint:
      type: object
      properties:
        id: { type: integer, format: int64 }
        recordingId: { type: string }
        userId: { type: string }
        itemId: { type: string }
        label: { type: string }
        pronunciationType: { $ref: "#/components/schemas/PronunciationType" }
        forgettingScore: { type: number, format: double }
        recommendation: { type: string }
        masteryLevel: { type: number, format: double, nullable: true, description: "BKT mastery probability [0,1]; null until the Java engine has scored this item at least once" }
        nextReviewAt: { type: string, format: date-time, nullable: true }
        scoreSource: { type: string, enum: [PYTHON_LEGACY, JAVA_ENGINE] }
        updatedAt: { type: string, format: date-time }

    ListeningWeakPoint:
      type: object
      properties:
        id: { type: integer, format: int64 }
        recordingId: { type: string }
        userId: { type: string }
        itemId: { type: string }
        label: { type: string }
        sourceType: { $ref: "#/components/schemas/ListeningSourceType" }
        forgettingScore: { type: number, format: double }
        recommendation: { type: string }
        masteryLevel: { type: number, format: double, nullable: true, description: "BKT mastery probability [0,1]; null until the Java engine has scored this item at least once" }
        nextReviewAt: { type: string, format: date-time, nullable: true }
        scoreSource: { type: string, enum: [PYTHON_LEGACY, JAVA_ENGINE] }
        updatedAt: { type: string, format: date-time }

    ApiResponseTranscriptResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/TranscriptResponse" }

    ApiResponseVocabularyWeakPointList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/VocabularyWeakPoint" }

    ApiResponseVocabularyWeakPointGrouped:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                type: array
                items: { $ref: "#/components/schemas/VocabularyWeakPoint" }

    ApiResponseGrammarWeakPointList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/GrammarWeakPoint" }

    ApiResponseGrammarWeakPointGrouped:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                type: array
                items: { $ref: "#/components/schemas/GrammarWeakPoint" }

    ApiResponsePronunciationWeakPointList:
      allOf:
