        message: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }

    ApiResponseError:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { nullable: true }

    ApiResponseVoid:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data: { nullable: true }

    PracticeAttemptRequest:
      type: object
      required: [itemId, category, label, correct]
      properties:
        itemId: { type: string }
        category: { type: string, description: "vocabulary, grammar or pronunciation" }
        label: { type: string }
        correct: { type: boolean }

    PracticeRedoRequest:
      type: object
      required: [userId, attempts]
      properties:
        userId: { type: string }
        attempts:
          type: array
          minItems: 1
