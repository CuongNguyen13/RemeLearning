    ApiResponseListeningWeakPointList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ListeningWeakPoint" }

    ApiResponseListeningWeakPointGrouped:
